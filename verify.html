<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>verify</title></head>
<body style="background:#000;color:#ccc;font-family:sans-serif;padding:16px">
<!-- Opened silently by the game launcher (inside the app it stays invisible).
     Open it in a normal browser as  .../verify.html?u=YourName  to see a readable test result. -->
<script>var __t0 = Date.now(); var MIN_MS = 5000; /* minimum time the game splash stays up (milliseconds) */</script>
<div id="out"></div>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function () {
  var inApp = !!window.Gate;
  function say(t) { if (!inApp) document.getElementById("out").textContent = t; }
  var q = new URLSearchParams(location.search);
  var name = q.get("u") || "", id = q.get("id") || "";
  if (!/^[A-Za-z0-9_]{3,16}$/.test(name)) { if (inApp) Gate.revoked(); else say("Add ?u=YourUsername to the address."); return; }
  if (typeof firebaseConfig === "undefined" || /PASTE_/.test(JSON.stringify(firebaseConfig))) { say("firebase-config.js still has the PASTE_ placeholders (or is missing)."); return; }
  say("Checking...");
  firebase.initializeApp(firebaseConfig);
  firebase.firestore().collection("usernames").doc(name.toLowerCase()).get({ source: "server" }).then(function (snap) {
    var d = snap.exists ? snap.data() : null;
    if (!inApp) { say(d ? "FOUND: username=" + d.username + " | owner uid=" + d.uid + (id ? (d.uid === id ? " | MATCHES id" : " | DOES NOT match id") : "")
                        : "NOT FOUND: no such username in Firebase."); return; }
    if (d && id && d.uid === id) {                                 // official spelling from Firebase
      var wait = Math.max(0, MIN_MS - (Date.now() - __t0));
      setTimeout(function () { Gate.verified(d.username); }, wait);
    }
    else Gate.revoked();                                        // deleted, or owned by someone else
  }).catch(function (e) {
    say("ERROR " + (e && e.code) + ": " + (e && e.message));   // in the app: stay silent so the loading screen stays up while offline
  });
})();
</script>
</body></html>
